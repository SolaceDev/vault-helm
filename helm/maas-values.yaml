maas:
  gcpProject: "maas-vault-dev"
  lbAddress: "35.237.91.67"
  kmsProject: "maas-vault-dev"
  kmsRegion: "global"
  kmsKeyRing: "maas-vault-dev"
  kmsCryptoKey: "maas-vault-dev-unseal"
  bucketName: "maas-vault-dev-vault-dev-data"
  datadogDogstatsdIP: "localhost"

global:
  # Enable TLS
  tlsDisable: false

# Disabling injector
injector:
  enabled: false

server:
  image:
    pullPolicy: Always
  extraVolumes:
    # Required for TLS
    - type: secret
      name: vault-server-tls
  shareProcessNamespace: true
  service:
    # Required for GCP Layer 4 Loadbalancer (so Vault can terminate SSL)
    type: LoadBalancer
  dataStorage:
    # GCS is used instead of the default Consul
    enabled: false
  auditStorage:
    enabled: true
  standalone:
    enabled: false
  ha:
    enabled: true
    # Since Vault HA is active/standby, replicas do not help with horizontal scaling
    # Issues were encountered configuring the LB to route to the active node, so this is being avoided by using 1 replica for now
    replicas: 1
    config: |
      api_addr     = "https://{{ .Values.maas.lbAddress }}"
      cluster_addr = "https://POD_IP:8201"

      log_level = "warn"

      ui = true

      # Required for auto-unseal
      seal "gcpckms" {
         project     = "{{ .Values.maas.kmsProject }}"
         region      = "{{ .Values.maas.kmsRegion }}"
         key_ring    = "{{ .Values.maas.kmsKeyRing }}"
         crypto_key  = "{{ .Values.maas.kmsCryptoKey }}"
      }

      listener "tcp" {
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_cert_file = "/vault/userconfig/vault-server-tls/tls.crt"
        tls_key_file  = "/vault/userconfig/vault-server-tls/tls.key"
        telemetry {
          unauthenticated_metrics_access = true
        }
      }

      telemetry {
        dogstatsd_addr = "HOST_IP:8125"
        disable_hostname = true
      }

      # Override storage to use GCS instead of Consul
      storage "gcs" {
        bucket     = "{{ .Values.maas.bucketName }}"
        ha_enabled = "true"
      }
  logrotate:
    enabled: true
    config:
      logRotateConf: |-
          /vault/audit/audit.log {
              rotate 0
              copytruncate
              size 5M
              missingok
              compress
              postrotate
                  pkill -HUP -f "vault server"
                  status=$?
                  echo  "`date`: Audit log rotated  -  SIGHUP to vault exit code was $status" > /vault/audit/last-rotate-status
              endscript
          }
    datadogsidecar:
      config: |-
        logs:
          - type: file
            path: /vault/audit/audit.log
            source: vault-audit.log
            service: maas-vault

  extraContainers:
    - name: logrotate
      image: gcr.io/maas-vault-prod/maas-vault-logrotate
      volumeMounts:
      - mountPath: /etc/logrotate.conf
        name: vault-logrotate-config
        subPath: logrotate.conf
        readOnly: true
      - name: audit
        mountPath: /vault/audit
      env:
      - name: TINI_SUBREAPER # tini won't be PID 1 due to shareProcessNamespace
        value: "100"
    - name: datadog-agent
      image: gcr.io/maas-vault-prod/datadog-agent:7
      securityContext:
        runAsGroup: 0
      ports:
        - containerPort: 8125
          name: dogstatsdport
          protocol: UDP
        - containerPort: 8126
          name: traceport
          protocol: TCP
      resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumeMounts:
      - mountPath: /etc/datadog-agent/conf.d/vault.d/conf.yaml
        name: vault-datadog-config
        subPath: conf.yaml
        readOnly: true
      - name: audit
        mountPath: /vault/audit
      env:
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-vault-secret
              key: api-key
        - name: DD_SITE
          value: "datadoghq.com"
        - name: DD_LOGS_ENABLED
          value: "true"
        - name: DD_LOGS_CONFIG_USE_HTTP
          value: "true"
        - name: DD_LOGS_CONFIG_USE_COMPRESSION
          value: "true"
        - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
          value: "false"
        - name: DD_ENABLE_PAYLOADS_SERIES
          value: "false"
        - name: DD_ENABLE_PAYLOADS_EVENTS
          value: "false"
        - name: DD_ENABLE_PAYLOADS_SERVICE_CHECKS
          value: "false"
        - name: DD_ENABLE_PAYLOADS_SKETCHES
          value: "false"
        - name: DD_PROCFS_PATH
          value: /proc
